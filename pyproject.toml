[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pq-kyber-aes-gcm"
version = "0.1.0"
description = "Post-quantum hybrid encryption: ML-KEM-768 (Kyber) + HKDF-SHA256 + AES-256-GCM, with a wire format and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shahd" }]
keywords = ["post-quantum", "ml-kem", "kyber", "hybrid-encryption", "aes-256-gcm"]
dependencies = ["kyber-py>=1.0", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pqkyber-aes = "pq_kyber_aes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
